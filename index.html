<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#080f25" />
        <meta
            name="description"
            content="格维开源社区（GTOC）：格物致知，多维创新。一个专注基础系统软件的开放技术社区。"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/gevico-logo-transparent.svg"
        />
        <link
            rel="preload"
            as="image"
            href="/assets/community-background.png"
        />
        <title>格维开源社区 · 格物致知，多维创新</title>
    </head>
    <body>
        <a class="skip-link" href="#main">跳转到主要内容</a>
        <div class="home">
            <div class="hero-background" aria-hidden="true">
                <div class="ambient ambient-blue"></div>
                <div class="ambient ambient-cyan"></div>
                <div class="light-ribbon ribbon-one"></div>
                <div class="light-ribbon ribbon-two"></div>
                <div class="hero-grain"></div>
            </div>
            <header class="header wrap">
                <a class="brand" href="#main" aria-label="格维开源社区首页"
                    ><img
                        src="/assets/gevico-logo-transparent.svg"
                        alt=""
                        width="46"
                        height="46"
                    /><span class="brand-name">GEVICO</span></a
                >
                <nav id="navigation" aria-label="社区链接">
                    <a
                        href="https://qm.qq.com/q/heSPPC9De8"
                        target="_blank"
                        rel="noopener noreferrer"
                        ><span data-icon="people"></span
                        ><span data-copy="qq">QQ 交流群</span></a
                    >
                    <a
                        href="https://t.me/gevico_channel"
                        target="_blank"
                        rel="noopener noreferrer"
                        ><span data-icon="send"></span
                        ><span data-copy="telegram">Telegram 频道</span></a
                    >
                    <a
                        href="https://space.bilibili.com/483048140"
                        target="_blank"
                        rel="noopener noreferrer"
                        ><span data-icon="video"></span
                        ><span data-copy="bilibili">哔哩哔哩订阅</span></a
                    >
                    <a
                        href="https://mp.weixin.qq.com/mp/appmsgalbum?__biz=Mzk0MTcyNzIyOA==&amp;action=getalbum&amp;album_id=4153732492274696193"
                        target="_blank"
                        rel="noopener noreferrer"
                        ><span data-icon="chat"></span
                        ><span data-copy="wechat">微信公众号</span></a
                    >
                    <a
                        class="nav-blog"
                        href="https://github.com/gevico/blogs"
                        target="_blank"
                        rel="noopener noreferrer"
                        ><span data-copy="blog">博客</span
                        ><span aria-hidden="true">↗</span></a
                    >
                    <a
                        class="nav-github"
                        href="https://github.com/gevico"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="GitHub"
                        ><span data-icon="github"></span
                        ><span class="github-label">GitHub</span></a
                    >
                </nav>
                <button
                    class="language-switch"
                    type="button"
                    aria-label="Switch to English"
                    lang="en"
                >
                    EN
                </button>
                <button
                    class="menu-toggle"
                    type="button"
                    aria-label="打开导航"
                    aria-expanded="false"
                    aria-controls="navigation"
                >
                    <span></span><span></span>
                </button>
            </header>
            <main id="main" class="hero wrap">
                <div class="hero-copy">
                    <p class="eyebrow">
                        <span class="status-dot"></span> GTOC · GEVICO TECH OPEN
                        COMMUNITY
                    </p>
                    <h1>格维开源社区</h1>
                    <p class="hero-motto">格物致知，<span>多维创新。</span></p>
                    <p class="hero-description">
                        向系统深处探索，与开源同路人一起创造。<br />一个专注基础系统软件的开放技术社区。
                    </p>
                    <div class="hero-actions">
                        <a
                            class="button primary"
                            href="https://github.com/gevico"
                            target="_blank"
                            rel="noopener noreferrer"
                            ><span data-copy="github-action"
                                >参与社区项目贡献</span
                            ><span aria-hidden="true">↗</span></a
                        ><a
                            class="button secondary"
                            href="https://github.com/gevico/blogs"
                            target="_blank"
                            rel="noopener noreferrer"
                            ><span data-copy="blog-action">阅读社区博客</span
                            ><span aria-hidden="true">↗</span></a
                        >
                    </div>
                </div>
            </main>
            <footer class="footer wrap">
                <span>© <span id="year">2026</span> GEVICO · GTOC</span
                ><span class="footer-motto">保持好奇 · 持续构建</span
                ><span>OPEN SOURCE. OPEN POSSIBILITIES.</span>
            </footer>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
